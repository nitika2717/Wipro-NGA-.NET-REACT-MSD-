<!DOCTYPE html>
<html>
<head>
<title>Dashboard</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">

<style>

body{
    font-family:'Poppins',sans-serif;
    background:linear-gradient(135deg,#36d1dc,#5b86e5);
    min-height:100vh;
}

/* NAVBAR */
.navbar{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(10px);
}

.navbar a{
    color:white;
    margin-right:15px;
    text-decoration:none;
    font-weight:500;
}

/* GLASS CARD */
.glass-card{
    background:rgba(255,255,255,0.2);
    backdrop-filter:blur(15px);
    border-radius:15px;
    padding:25px;
    color:white;
    box-shadow:0 8px 32px rgba(0,0,0,0.2);
}

.btn-gradient{
    background:linear-gradient(45deg,#ff6a00,#ee0979);
    border:none;
    color:white;
    border-radius:10px;
}

.section-title{
    color:white;
    font-weight:600;
}

table{
    background:white;
    border-radius:10px;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar p-3">
<div class="container">
<a href="index.html">Home</a>
<a href="patients.html">Patients</a>
<a href="doctor.html">Doctors</a>
<a href="department.html">Departments</a>
</div>
</nav>

<div class="container mt-5">

<h2 class="text-center text-white mb-4">
  Healthcare Dashboard
</h2>

<!-- QUICK ACTIONS -->
 <div class="row text-center mb-4">

<div class="col-md-3">
<div class="glass-card">
<h5>Total</h5>
<h2 id="totalCount">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="glass-card">
<h5>Scheduled</h5>
<h2 id="scheduledCount">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="glass-card">
<h5>Completed</h5>
<h2 id="completedCount">0</h2>
</div>
</div>

<div class="col-md-3">
<div class="glass-card">
<h5>Cancelled</h5>
<h2 id="cancelledCount">0</h2>
</div>
</div>

</div>


<div class="row g-4">

<!-- PATIENT -->
<div class="col-md-6">
<div class="glass-card">

<h4> Register Patient</h4>

<input id="fullName" class="form-control mb-3" placeholder="Full Name">
<input type="date" id="dob" class="form-control mb-3">

<button class="btn btn-gradient w-100" onclick="addPatient()">
Register Patient
</button>

<p id="patientMessage"></p>

</div>
</div>

<!-- APPOINTMENT -->
<div class="col-md-6">
<div class="glass-card">

<h4>Schedule Appointment</h4>

<input type="number" id="patientId" class="form-control mb-3" placeholder="Patient ID">
<input type="number" id="doctorId" class="form-control mb-3" placeholder="Doctor ID">
<input type="datetime-local" id="appointmentDate" class="form-control mb-3">

<button class="btn btn-gradient w-100" onclick="addAppointment()">
Schedule Appointment
</button>

<p id="appointmentMessage"></p>

</div>
</div>

</div>

<!-- TABLE -->
<div class="mt-5">

<h4 class="section-title text-center"> Appointments Overview</h4>

<div class="table-responsive">

<table class="table table-striped">

<thead class="table-dark">
<tr>
<th>ID</th>
<th>Patient</th>
<th>Doctor</th>
<th>Date</th>
<th>Status</th>
<th>Actions</th>
</tr>
</thead>

<tbody id="appointmentTable"></tbody>

</table>

</div>

</div>

</div>

<script type="module" src="../js/dist/app.js"></script>

</body>
</html>
