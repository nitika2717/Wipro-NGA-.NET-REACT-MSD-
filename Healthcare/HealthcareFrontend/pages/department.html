<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Departments</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<link rel="stylesheet" href="../css/style.css">

</head>

<body>

<div class="navbar-custom">

<a href="dashboard.html">Dashboard</a>
<a href="patients.html">Patients</a>
<a href="doctor.html">Doctors</a>

</div>

<div class="container mt-5">

<h1 class="text-center text-white mb-5">
Department Management
</h1>

<div class="glass-card col-md-6 mx-auto mb-5"> 

<h4 class="text-center mb-4">
Add Department
</h4>

<input
id="departmentName"
class="form-control mb-4"
placeholder="Department Name">

<button
class="btn btn-gradient w-100"
onclick="addDepartment()">

Add Department

</button>

<p id="departmentMessage" class="mt-3 text-center"></p>

</div>



<h3 class="text-center text-white mb-3">
Department List
</h3>

<div class="table-container">

<table class="table table-striped">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Name</th>
</tr>

</thead>

<tbody id="departmentTableBody"></tbody>

</table>

</div>

</div>

<script type="module" src="../js/dist/app.js"></script>

</body>

</html>
