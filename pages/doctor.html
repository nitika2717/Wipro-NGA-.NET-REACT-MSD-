<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<title>Doctors</title>

<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<!-- Your CSS -->
<link rel="stylesheet" href="../css/style.css">

</head>


<body>

<!-- NAVBAR -->

<div class="navbar-custom">

<a href="dashboard.html">Dashboard</a>
<a href="patients.html">Patients</a>
<a href="department.html">Departments</a>

</div>



<div class="container mt-5">

<h1 class="text-center text-white mb-5">
Doctor Management
</h1>


<!-- ADD DOCTOR CARD -->

<div class="glass-card col-md-6 mx-auto mb-5"> 

<h4 class="text-center mb-4 color-white">
Add Doctor
</h4>

<input
id="doctorName"
class="form-control mb-3"
placeholder="Doctor Name">

<input
id="departmentId"
type="number"
class="form-control mb-4"
placeholder="Department ID">

<button
class="btn btn-gradient w-100"
onclick="addDoctor()">

Add Doctor

</button>

<p id="doctorMessage" class="mt-3 text-center"></p>

</div>



<!-- DOCTOR TABLE -->

<h3 class="text-center text-white mb-3">
Doctor List
</h3>

<div class="table-container">

<table class="table table-striped">

<thead class="table-dark">

<tr>
<th>ID</th>
<th>Name</th>
<th>Department</th>
</tr>

</thead>

<tbody id="doctorTableBody">

</tbody>

</table>

</div>


</div>


<!-- JS -->

<script type="module" src="../js/dist/app.js"></script>

</body>

</html>
